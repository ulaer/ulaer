<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ulaer — Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1426" />
      <stop offset="1" stop-color="#0A0F1E" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0" r="0.8">
      <stop offset="0" stop-color="#3D7BEA" stop-opacity="0.38" />
      <stop offset="0.55" stop-color="#3D7BEA" stop-opacity="0.08" />
      <stop offset="1" stop-color="#3D7BEA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.95" cy="1" r="0.75">
      <stop offset="0" stop-color="#7357E6" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#7357E6" stop-opacity="0.07" />
      <stop offset="1" stop-color="#7357E6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DF0" />
      <stop offset="1" stop-color="#7B5CF0" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FB2FF" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="20" /></clipPath>
    <clipPath id="typeTr"><rect class="type-tr" x="96" y="222" width="0" height="34" /></clipPath>
    <clipPath id="typeEn"><rect class="type-en" x="96" y="256" width="0" height="34" /></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .name { font-size: 64px; font-weight: 600; fill: #FFFFFF; letter-spacing: -1px; }
      .role { font-size: 24px; font-weight: 300; fill: #C9D6EA; }
      .stack { font-size: 15px; font-weight: 600; fill: #7FB2FF; letter-spacing: 2px; }
      .label { font-size: 13px; font-weight: 600; fill: #8EA5C6; letter-spacing: 1.5px; }
      .tr { font-size: 20px; font-weight: 300; fill: #E7EEF8; }
      .en { font-size: 20px; font-weight: 400; fill: url(#accent); }
      .orb { animation: drift 9s ease-in-out infinite alternate; }
      .orb2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
      .type-tr { animation: typeTr 9s steps(46) infinite; }
      .type-en { animation: typeEn 9s steps(44) infinite; }
      .caret { animation: blink 1s step-end infinite; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(40px, 16px); } }
      @keyframes typeTr { 0% { width: 0; } 25% { width: 520px; } 92% { width: 520px; } 100% { width: 0; } }
      @keyframes typeEn { 0%, 32% { width: 0; } 58% { width: 520px; } 92% { width: 520px; } 100% { width: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect class="orb" x="-40" y="-20" width="1280" height="360" fill="url(#glowBlue)" />
    <rect class="orb2" x="-40" y="-20" width="1280" height="360" fill="url(#glowViolet)" />
    <rect width="1200" height="320" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" />

    <!-- Logo -->
    <rect x="96" y="54" width="44" height="44" rx="13" fill="url(#logo)" />
    <text x="118" y="85" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">u</text>
    <circle cx="140" cy="56" r="5" fill="#9FE3FF" stroke="#0C1426" stroke-width="2" />

    <text class="name" x="160" y="98">ulaer</text>
    <text class="role" x="96" y="146">Software Developer · masaüstü uygulamaları ve yapay zekâ</text>
    <text class="stack" x="96" y="182">C#  ·  .NET  ·  WPF  ·  GEMINI API  ·  XUNIT</text>

    <!-- Lingora'dan bir çeviri anı -->
    <text class="label" x="1104" y="70" text-anchor="end">NOW BUILDING · LINGORA</text>
    <text class="tr" x="96" y="246" clip-path="url(#typeTr)">Yarın sabah erkenden yola çıkmamız gerekiyor.</text>
    <text class="en" x="96" y="280" clip-path="url(#typeEn)">→ We need to set off early tomorrow morning.</text>
  </g>
</svg>
